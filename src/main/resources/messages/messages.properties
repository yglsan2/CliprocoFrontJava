# Messages de validation
# Ces messages sont utilisés pour indiquer les erreurs de validation des données

# Validation de l'email
validation.email=Email invalide
# Le format de l'email doit suivre la norme RFC 5322
validation.email.invalid=L'adresse email n'est pas valide

# Validation du téléphone
validation.phone=Numéro de téléphone invalide
# Le numéro doit être au format français
validation.phone.invalid=Le numéro de téléphone n'est pas valide

# Validation du code postal
validation.postal=Code postal invalide
# Le code postal doit être composé de 5 chiffres
validation.postal.invalid=Le code postal doit contenir 5 chiffres

# Validation du montant
validation.amount=Montant invalide
# Le montant doit être un nombre positif
validation.amount.invalid=Le montant doit être un nombre positif

# Validation du nom
validation.name=Nom invalide
# Le nom ne doit pas être vide et ne doit pas dépasser 100 caractères
validation.name.invalid=Le nom doit contenir entre 2 et 50 caractères

# Messages de log
# Ces messages sont utilisés pour tracer les opérations dans les logs

# Création
log.create=Début de la création
# Indique le début d'une opération de création
action.create=Création de {0}

# Mise à jour
log.update=Début de la mise à jour
# Indique le début d'une opération de mise à jour
action.update=Mise à jour de {0}

# Suppression
log.delete=Début de la suppression
# Indique le début d'une opération de suppression
action.delete=Suppression de {0}

# Recherche
log.find=Début de la recherche
# Indique le début d'une opération de recherche
action.find=Recherche de {0}

# Messages de succès
# Ces messages sont utilisés pour indiquer le succès des opérations

# Création réussie
success.create=Création réussie
# Indique que l'opération de création a réussi
success.create={0} créé avec succès

# Mise à jour réussie
success.update=Mise à jour réussie
# Indique que l'opération de mise à jour a réussi
success.update={0} mis à jour avec succès

# Suppression réussie
success.delete=Suppression réussie
# Indique que l'opération de suppression a réussi
success.delete={0} supprimé avec succès
